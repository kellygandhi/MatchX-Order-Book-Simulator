<style>

.fl{display:flex;gap:4px;margin-bottom:8px;flex-wrap:wrap}

.list{max-height:560px;overflow-y:auto}

.modal{position:fixed;inset:0;background:rgba(0,0,0,.72);display:grid;place-items:center;z-index:20;padding:16px}

.mb h3{font-size:17px;margin:0 0 12px}

.seg button[aria-pressed=true].t{background:var(--c1);color:var(--tx)}
.seg.sm{margin-bottom:10px}

::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:transparent}

::-webkit-scrollbar-thumb:hover{background:#4a4a52}
::-webkit-scrollbar-corner{background:transparent}}

input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--g);border:2px solid #000;box-shadow:0 0 0 1px var(--g)}
input[type=range]::-moz-range-track{height:4px;border-radius:99px;background:#2a2a30}
input[type=range]::-moz-range-thumb{width:10px;height:10px;border-radius:50%;background:var(--g);border:2px solid #000;box-shadow:0 0 0 1px var(--g)}

<body>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/htm@3.1.1/dist/htm.umd.js"></script>
<script>
"use strict";
const {useState,useEffect,useRef,useReducer}=React, html=htm.bind(React.createElement);
const f2=n=>n.toLocaleString("en-IN",{minimumFractionDigits:2,maximumFractionDigits:2}), r2=n=>Math.round(n/0.05)*0.05;
const RAW="RELIANCE,Reliance Industries,2900;TCS,Tata Consultancy,3900;HDFCBANK,HDFC Bank,1650;INFY,Infosys,1600;ICICIBANK,ICICI Bank,1200;HINDUNILVR,Hindustan Unilever,2400;ITC,ITC Ltd,440;SBIN,State Bank of India,780;BHARTIARTL,Bharti Airtel,1500;KOTAKBANK,Kotak Mahindra Bank,1750;LT,Larsen & Toubro,3500;AXISBANK,Axis Bank,1150;ASIANPAINT,Asian Paints,2900;MARUTI,Maruti Suzuki,12000;BAJFINANCE,Bajaj Finance,7000;HCLTECH,HCL Technologies,1700;SUNPHARMA,Sun Pharma,1650;TITAN,Titan Company,3400;ULTRACEMCO,UltraTech Cement,11000;WIPRO,Wipro,520;NESTLEIND,Nestle India,2500;ONGC,ONGC,270;NTPC,NTPC,380;POWERGRID,Power Grid,320;TATAMOTORS,Tata Motors,950;TATASTEEL,Tata Steel,150;MAHINDRA,Mahindra & Mahindra,2800;JSWSTEEL,JSW Steel,900;ADANIPORTS,Adani Ports,1350;COALINDIA,Coal India,450;BAJAJFINSV,Bajaj Finserv,1650;TECHM,Tech Mahindra,1450;GRASIM,Grasim,2600;CIPLA,Cipla,1500;DRREDDY,Dr. Reddy’s,6200;EICHERMOT,Eicher Motors,4800;HEROMOTOCO,Hero MotoCorp,4700;BRITANNIA,Britannia,5000;DIVISLAB,Divi’s Labs,5400;APOLLOHOSP,Apollo Hospitals,6500;HINDALCO,Hindalco,650;BPCL,BPCL,330;TATACONSUM,Tata Consumer,1100;SBILIFE,SBI Life,1500;HDFCLIFE,HDFC Life,650;INDUSINDBK,IndusInd Bank,1000;UPL,UPL Ltd,520;ZOMATO,Zomato,260;PAYTM,Paytm,700;DMART,Avenue Supermarts,4200;PIDILITE,Pidilite,3000;HAVELLS,Havells,1700;DABUR,Dabur,540;GAIL,GAIL,210;IOC,Indian Oil,160;VEDL,Vedanta,440;BANKBARODA,Bank of Baroda,250;PNB,Punjab National Bank,110;IRCTC,IRCTC,900;JIOFIN,Jio Financial,330";
const SYMS={};RAW.split(";").forEach(r=>{const [s,n,p]=r.split(",");SYMS[s]={n,p:+p}});
const KEYS=Object.keys(SYMS),CASH0=1000000,HOLD0=KEYS.filter((_,i)=>i%12===0);

/* ===== Data structures ===== */
class Heap{constructor(c){this.a=[];this.c=c}peek(){return this.a[0]}
 push(x){const a=this.a,c=this.c;a.push(x);let i=a.length-1;while(i>0){const p=(i-1)>>1;if(c(a[i],a[p])<0){[a[i],a[p]]=[a[p],a[i]];i=p}else break}}
 pop(){const a=this.a,c=this.c,t=a[0],l=a.pop();if(a.length){a[0]=l;let i=0;for(;;){let m=i,L=2*i+1,R=L+1;if(L<a.length&&c(a[L],a[m])<0)m=L;if(R<a.length&&c(a[R],a[m])<0)m=R;if(m===i)break;[a[i],a[m]]=[a[m],a[i]];i=m}}return t}}
class Ring{constructor(n){this.b=new Array(n);this.i=0;this.n=0}add(x){this.b[this.i]=x;this.i=(this.i+1)%this.b.length;this.n=Math.min(this.n+1,this.b.length)}
 newest(k){const o=[],L=this.b.length;for(let j=1;j<=Math.min(k,this.n);j++)o.push(this.b[(this.i-j+L)%L]);return o}}
const bidC=(x,y)=>y.price-x.price||x.seq-y.seq, askC=(x,y)=>x.price-y.price||x.seq-y.seq;

/* ===== Matching engine ===== */
class Exchange{
 constructor(){this.books={};this.bs={};this.vol={};for(const s of KEYS){this.books[s]={bids:new Heap(bidC),asks:new Heap(askC),last:SYMS[s].p};this.bs[s]=[];this.vol[s]=0}
  this.orders=new Map();this.you=new Set();this.trades=[];this.audit=new Ring(2000);
  this.alerts=[];this.yr=[];this.pend=0;this.nid=0;this.seq=0;this.acc=0;this.filled=0;this.rej=0;this.us=0;this.stamps=[];
  this.cash=CASH0;this.hold={};this.cost={};for(const s of KEYS){this.hold[s]=0;this.cost[s]=0}
  for(const s of HOLD0){const q=50+Math.floor(Math.random()*21);this.hold[s]=q;this.cost[s]=q*SYMS[s].p}this.w0=this.worth()}
 worth(){return this.cash+KEYS.reduce((a,k)=>a+this.hold[k]*this.books[k].last,0)}
 log(type,o,d){this.audit.add({t:new Date().toLocaleTimeString("en-GB"),type,id:o?o.id:"-",d})}
 live(o){return o.status==="OPEN"||o.status==="PARTIAL"}
 reserved(sym){let c=0,s=0;for(const id of this.you){const o=this.orders.get(id);if(o.side==="BUY")c+=o.price*o.rem;else if(o.sym===sym)s+=o.rem}return{c,s}}
 submit(sym,side,price,qty,user,ioc){
  const t=performance.now(),o={id:++this.nid,sym,side,price,qty,rem:qty,seq:++this.seq,status:"OPEN",user,t:Date.now()};let err=null;
  if(!(price>0)||!(qty>0)||!Number.isInteger(qty))err="Enter a price above 0 and a whole-number quantity.";
  else if(user==="YOU"){const rv=this.reserved(sym);
   if(side==="BUY"&&this.cash-rv.c<price*qty)err="Not enough cash. Free cash is ₹"+f2(this.cash-rv.c)+".";
   if(side==="SELL"&&this.hold[sym]-rv.s<qty)err="Not enough shares. Free shares: "+(this.hold[sym]-rv.s)+".";}
  if(err){o.status="REJECTED";o.why=err;if(user==="YOU")this.yr.push(o);this.rej++;this.log("REJECTED",o,err);return{ok:false,err,o}}
  this.orders.set(o.id,o);if(user==="YOU")this.you.add(o.id);this.acc++;
  this.log("ACCEPTED",o,`${side} ${qty} ${sym} @ ${f2(price)}`);
  this.match(o);
  if(o.rem>0&&ioc){this.done(o,"CANCELLED");this.log("CANCELLED",o,`market order: ${o.rem} unfilled`)}
  else if(o.rem>0){const b=this.books[sym];o.rest=true;this.pend++;(side==="BUY"?b.bids:b.asks).push(o)}
  this.us+=performance.now()-t;this.stamps.push(Date.now());return{ok:true,o}}
 done(o,st){if(o.rest){o.rest=false;this.pend--}o.status=st;if(st==="FILLED")this.filled++;if(o.user!=="YOU")this.orders.delete(o.id);else this.you.delete(o.id)}
 match(o){const b=this.books[o.sym],opp=o.side==="BUY"?b.asks:b.bids;
  while(o.rem>0){let top=opp.peek();while(top&&!this.live(top)){opp.pop();top=opp.peek()}
   if(!top||(o.side==="BUY"?top.price>o.price:top.price<o.price))break;
   const q=Math.min(o.rem,top.rem),p=top.price;o.rem-=q;top.rem-=q;b.last=p;
   const by=o.side==="BUY"?o:top,sl=o.side==="BUY"?top:o;
   if(by.user==="YOU"){this.cash-=p*q;this.cost[o.sym]+=p*q;this.hold[o.sym]+=q}if(sl.user==="YOU"){this.cash+=p*q;this.cost[o.sym]-=this.cost[o.sym]/this.hold[o.sym]*q;this.hold[o.sym]-=q}if(by.user==="YOU")by.fv=(by.fv||0)+p*q;if(sl.user==="YOU")sl.fv=(sl.fv||0)+p*q;
   this.trades.push({sym:o.sym,p,q,b:by.id,s:sl.id,t:Date.now(),y:by.user==="YOU"||sl.user==="YOU"});this.bs[o.sym].push(p);this.vol[o.sym]+=q;
   this.log("EXECUTED",o,`${q} ${o.sym} @ ${f2(p)} (buy #${by.id}, sell #${sl.id})`);
   if(top.user==="YOU")this.alerts.push(`Order #${top.id} ${top.rem?"part-filled":"filled"}: ${q} ${top.side==="BUY"?"bought":"sold"} ${o.sym} at ₹${f2(p)}`);top.status=top.rem?"PARTIAL":"OPEN";if(!top.rem){opp.pop();this.done(top,"FILLED")}o.status=o.rem?"PARTIAL":"OPEN"}
  if(!o.rem)this.done(o,"FILLED")}
 cancel(id){const o=this.orders.get(id);if(!o||!this.live(o))return false;const r=o.rem;this.done(o,"CANCELLED");this.log("CANCELLED",o,`${r} left of ${o.qty}`);return true}
 modify(id,price,qty){const o=this.orders.get(id);if(!o||!this.live(o))return{ok:false,err:"Order is no longer open."};
  const fl=o.qty-o.rem,nq=qty-fl;if(!Number.isInteger(qty)||nq<=0||!(price>0))return{ok:false,err:"New quantity must exceed the "+fl+" already filled."};
  if(price===o.price&&nq<=o.rem){o.rem=nq;o.qty=qty;this.log("MODIFIED",o,`quantity now ${qty}, priority kept`);return{ok:true}}
  const rv=this.reserved(o.sym);if(o.side==="BUY"?this.cash-(rv.c-o.price*o.rem)<price*nq:this.hold[o.sym]-(rv.s-o.rem)<nq)return{ok:false,err:"Not enough cash or shares for that change."};
  this.cancel(id);const r=this.submit(o.sym,o.side,price,nq,"YOU");if(r.ok)this.log("MODIFIED",r.o,`re-queued from #${id}, priority reset`);return r}
 levels(sym,side){const m=new Map();for(const o of this.books[sym][side==="BUY"?"bids":"asks"].a)if(this.live(o)){const e=m.get(o.price)||{p:o.price,q:0,n:0};e.q+=o.rem;e.n++;m.set(o.price,e)}
  return[...m.values()].sort((a,b)=>side==="BUY"?b.p-a.p:a.p-b.p)}
}
let X=new Exchange();
function seed(){for(const s of KEYS){let b=SYMS[s].p;for(let i=0;i<80;i++){b=r2(b*(1+(Math.random()-.5)*.008));X.bs[s].push(b)}X.books[s].last=b;for(let i=1;i<=12;i++){X.submit(s,"BUY",r2(b-i*b*.003),5+Math.floor(Math.random()*20),"BOT");X.submit(s,"SELL",r2(b+i*b*.003),5+Math.floor(Math.random()*20),"BOT")}}}
function bot(){const s=KEYS[Math.floor(Math.random()*KEYS.length)],b=X.books[s],sd=Math.random()<.5?"BUY":"SELL",d=(Math.random()-.4)*b.last*.006;
 X.submit(s,sd,Math.max(.05,r2(b.last+(sd==="BUY"?-1:1)*d)),1+Math.floor(Math.random()*25),"BOT")}
seed();

/* ===== Benchmark engines ===== */
function stream(n){let s=12345;const r=()=>(s=(s*1664525+1013904223)>>>0)/4294967296,a=[];for(let i=0;i<n;i++){const b=r()<.5;a.push({side:b,price:Math.round((b?90+r()*12:98+r()*12)*20)/20,qty:1+Math.floor(r()*20),seq:i})}return a}
function runHeap(os){const B=new Heap(bidC),A=new Heap(askC);let t=0;for(const s of os){const o={...s,rem:s.qty},opp=o.side?A:B;
 while(o.rem>0){const x=opp.peek();if(!x||(o.side?x.price>o.price:x.price<o.price))break;const q=Math.min(o.rem,x.rem);o.rem-=q;x.rem-=q;t++;if(!x.rem)opp.pop()}
 if(o.rem>0)(o.side?B:A).push(o)}return t}
function runArr(os){const B=[],A=[];let t=0;for(const s of os){const o={...s,rem:s.qty},opp=o.side?A:B;
 while(o.rem>0){const x=opp[opp.length-1];if(!x||(o.side?x.price>o.price:x.price<o.price))break;const q=Math.min(o.rem,x.rem);o.rem-=q;x.rem-=q;t++;if(!x.rem)opp.pop()}
 if(o.rem>0){const ar=o.side?B:A;let lo=0,hi=ar.length;while(lo<hi){const m=(lo+hi)>>1;if(o.side?ar[m].price<o.price:ar[m].price>o.price)lo=m+1;else hi=m}ar.splice(lo,0,o)}}return t}

function Candles({p}){const cs=[];for(let i=0;i<p.length;i+=4){const s=p.slice(i,i+4);cs.push({o:s[0],c:s[s.length-1],h:Math.max(...s),l:Math.min(...s)})}

  ${[0,1,2,3,4].map(i=>{const v=hi-sp*i/4;return html`<g key=${i}><line x1="0" x2="660" y1=${y(v)} y2=${y(v)} stroke="#1a1a1e"/><text x="668" y=${y(v)+4} fill="#85858d" fontSize="11" fontFamily="JetBrains Mono,monospace">${f2(v)}</text></g>`})}

function Bench(){const [res,setRes]=useState(null),[busy,setBusy]=useState(0);
 const run=n=>{setBusy(n);setTimeout(()=>{const o=stream(n);let t=performance.now();const a=runHeap(o),h=performance.now()-t;t=performance.now();const c=runArr(o),s=performance.now()-t;setRes({n,h,s,a,c});setBusy(0)},40)};
 const mx=res?Math.max(res.h,res.s):1;
 return html`<div><p className="note">Sends the same random order stream through a heap engine and a sorted-array engine and compares the time taken.</p>
  <div style=${{display:"flex",gap:8,flexWrap:"wrap"}}>${[10000,50000,150000].map(n=>html`<button key=${n} className="btn" disabled=${!!busy} onClick=${()=>run(n)}>${busy===n?"Running…":n.toLocaleString("en-IN")+" orders"}</button>`)}</div>
  ${res&&html`<div style=${{marginTop:14}}><div className="kv"><span>Heap</span><b className="m up">${res.h.toFixed(1)} ms</b></div><div className="bar" style=${{background:"var(--g)",width:res.h/mx*100+"%"}}/>
   <div className="kv"><span>Sorted array</span><b className="m dn">${res.s.toFixed(1)} ms</b></div><div className="bar" style=${{background:"var(--r)",width:res.s/mx*100+"%"}}/>
   <p className="note">${res.n.toLocaleString("en-IN")} orders; ${res.a===res.c?res.a.toLocaleString("en-IN")+" trades in both engines, so the results match.":"trade counts differ."} Heap insert is O(log n), array insert shifts elements, O(n). Timings depend on your device.</p></div>`}</div>`}

const DSA=[["Binary heap","One max-heap of buys and one min-heap of sells per stock; the top is the best price.","Insert O(log n), best price O(1)"],["Sequence number","Orders at the same price are ordered by arrival, so the earlier one matches first (FIFO).","O(1) per comparison"],["Hash map","Order ID to order record, used for cancel, modify and status.","O(1) average"],["Lazy deletion","A cancelled order is marked dead and dropped when it reaches the top of its heap.","Cancel O(1)"],["Circular buffer","The audit trail keeps the latest 2,000 events in fixed memory.","Add O(1)"],["Dynamic array","Executed trades and price history for charts and reports.","Append O(1) amortised"],["Sorted array","Baseline engine used only in the benchmark.","Insert O(n)"]];

     <div className="kpi"><span>Profit / loss since start</span><b className=${"m "+(pl>=0?"up":"dn")}>${pl>=0?"+":"−"}₹${f2(Math.abs(pl))}</b></div>
     <div className="kpi"><span>Cash</span><b className="m">₹${f2(X.cash)}</b></div><div className="kpi"><span>Free cash</span><b className="m">₹${f2(X.cash-X.reserved(sym).c)}</b></div><div className="kpi"><span>Holdings</span><b className="m">₹${f2(nw-X.cash)}</b></div></div></div>
    <div className="card"><div className="hd"><div><span className="mu">${SYMS[sym].n} (${sym})</span><div className="big m">₹${f2(bk.last)}</div></div>
     <div className="kpi"><span>Change</span><b className=${"m "+(ch>=0?"up":"dn")}>${ch>=0?"+":""}${ch.toFixed(2)}%</b></div>
     <div className="kpi"><span>High</span><b className="m">${f2(hi)}</b></div><div className="kpi"><span>Low</span><b className="m">${f2(lo)}</b></div><div className="kpi"><span>You hold</span><b className="m">${X.hold[sym]}</b></div></div>
     <${Candles} p=${pr.slice(-200)}/></div>
    <${Tabs} tab=${tab} setTab=${setTab} act=${act} pick=${pick}/>
   </div>
   <div className="col" key=${"r"+gen}><${Book} sym=${sym} setPrice=${setPrice}/><${Ticket} sym=${sym} side=${side} setSide=${setSide} price=${price} setPrice=${setPrice} qty=${qty} setQty=${setQty} say=${say} setTab=${setTab}/></div>
  </div>
  ${toast&&html`<div className=${"toast"+(toast.ok?"":" err")} role="status">${toast.t}</div>`}</div>`}
ReactDOM.createRoot(document.getElementById("root")).render(html`<${App}/>`);
</script>
</body>
</html>
